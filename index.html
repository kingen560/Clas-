<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>From Search to Choice · Clas Ohlson</title><meta name="description" content="An animated customer experience audit of Clas Ohlson in Oslo and Strømmen."><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Public+Sans:wght@400;600;700&family=DM+Mono&display=swap"><style>#stage { --ground:#0E2A26; --main:#F4C430; --second:#EEF3EA; --accent:#FF6A4D; color:var(--second); font-family:var(--sans, system-ui, sans-serif);
  --peg:color-mix(in srgb, var(--second) 9%, transparent); --rail:color-mix(in srgb, var(--second) 38%, var(--ground)); --panel:color-mix(in srgb, var(--ground) 88%, var(--second)); --dim:color-mix(in srgb, var(--second) 62%, var(--ground)); --shadowtag:color-mix(in srgb, var(--main) 55%, var(--ground)) }

*{box-sizing:border-box}body{margin:0;background:#091c19;color:#eef3ea;font-family:'Public Sans',sans-serif}main{max-width:1500px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:22px}h1{font-size:clamp(20px,3vw,32px);margin:6px 0}.label{color:#f4c430;font-size:11px;letter-spacing:.16em;text-transform:uppercase}.meta{font-size:12px;color:#adbbb6}.screen{position:relative;aspect-ratio:16/9;overflow:hidden;background:#0e2a26;border:1px solid #345048;border-radius:10px}#stage{position:absolute;width:1920px;height:1080px;transform-origin:top left;--display:'Barlow Condensed';--sans:'Public Sans';--mono:'DM Mono'}#controls{display:flex;gap:12px;align-items:center;padding:18px 0;flex-wrap:wrap}button,select{background:#183b33;border:1px solid #466157;color:#eef3ea;border-radius:7px;padding:11px 15px;font:inherit;font-size:13px;cursor:pointer}button:hover{background:#2c5145}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #f4c430}#play{background:#f4c430;color:#0e2a26;border-color:#f4c430;font-weight:bold;min-width:88px}#seek{flex:1;min-width:100px;accent-color:#f4c430}#time{font:12px 'DM Mono',monospace}select{max-width:100%}.note{font-size:12px;color:#adbbb6;line-height:1.6}.screen:fullscreen{width:100vw;height:100vh;border:0;border-radius:0;aspect-ratio:auto}footer{border-top:1px solid #28443b;padding-top:14px;display:flex;justify-content:space-between;gap:20px}@media(max-width:600px){main{padding:14px}header .meta{display:none}#controls{gap:8px}footer{display:block}#time{font-size:10px}}</style>
<main><header><div><div class="label">Clas Ohlson · Customer experience audit</div><h1>From Search to Choice</h1></div><div class="meta">BI Norwegian Business School · 2026</div></header><div class="screen" id="screen"><div id="stage"></div></div><div id="controls"><button id="play" aria-label="Play presentation">Play</button><input id="seek" type="range" min="0" value="0" step="0.1" aria-label="Presentation position"><span id="time"></span><button id="sound" aria-pressed="false">Sound off</button><button id="full">Full screen</button><select id="chapters" aria-label="Choose scene"></select></div><footer><div class="note">6 store visits · 4 stores · 74 Google reviews<br>MST 0220 Customer Experience Management</div><div class="note">Animated presentation · Use Space to play or pause<br>Sound is recreated in the browser from the supplied score.</div></footer></main><script>const scenes=new Map();const clamp01=x=>Math.max(0,Math.min(1,x));const seg=(t,a,b)=>clamp01((t-a)/(b-a));const eo=x=>1-(1-x)**3;const eio=x=>x<.5?4*x*x*x:1-(-2*x+2)**3/2;const lerp=(a,b,x)=>a+(b-a)*x;const eob=(x,s=1.70158)=>1+(s+1)*(x-1)**3+s*(x-1)**2;
window.kit={stage:document.getElementById('stage'),seg,eo,eio,eob,lerp,clamp01,scene:(id,s)=>scenes.set(id,s),h:html=>{const t=document.createElement('template');t.innerHTML=html;return t.content},TextFx:{fadeFromRight:(el,t,a)=>{let p=eo(seg(t,a,a+.65));el.style.opacity=p;el.style.transform=`translateX(${lerp(35,0,p)}px)`}},score:fn=>window.makeScore=fn};
// The store's fixtures. Pegboard ground and vignette live in base.css; these build the rails, signs and tags every scene hangs things on.
window.W = {
  // A hanging sign on two cords from the ceiling. Its group pivots at the ceiling point (cx, -160) so a scene swings it by one rotate.
  sign(cls, cx, y, w, h, size, text) {
    const x = cx - w / 2;
    return '<div class="' + cls + '" style="position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:' + cx + 'px -160px">' +
      '<div class="box" style="left:' + (x + w * 0.18) + 'px;top:0;width:4px;height:' + y + 'px;background:var(--rail)"></div>' +
      '<div class="box" style="left:' + (x + w * 0.82 - 4) + 'px;top:0;width:4px;height:' + y + 'px;background:var(--rail)"></div>' +
      '<div class="sign" style="left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;min-height:' + h + 'px;font-size:' + size + 'px">' + text + '</div></div>';
  },
  // A shelf rail with two wall brackets.
  rail(cls, x, y, w) {
    return '<div class="rail ' + cls + '" style="left:' + x + 'px;top:' + y + 'px;width:' + w + 'px"></div>' +
      '<div class="box" style="left:' + (x + 30) + 'px;top:' + (y + 10) + 'px;width:10px;height:26px;border-radius:3px;background:var(--rail)"></div>' +
      '<div class="box" style="left:' + (x + w - 40) + 'px;top:' + (y + 10) + 'px;width:10px;height:26px;border-radius:3px;background:var(--rail)"></div>';
  },
  // The three observation dates on one line; the active ones lit.
  dates(cls, active) {
    const d = [['19 Oct 2026', '3 visits'], ['26 Oct 2026', '2 visits'], ['3 Nov 2026', '1 visit']];
    return '<div class="' + cls + '" style="position:absolute;left:140px;top:70px;width:1640px;height:90px">' +
      '<div class="box" style="left:10px;top:21px;width:1100px;height:4px;background:var(--rail)"></div>' +
      d.map((x, i) => { const on = active.indexOf(i) >= 0; return '<div class="box" style="left:' + (i * 520) + 'px;top:0;display:flex;gap:16px;align-items:flex-start">' +
        '<div style="width:28px;height:28px;margin-top:9px;border-radius:50%;box-sizing:border-box;border:4px solid ' + (on ? 'var(--main)' : 'var(--rail)') + ';background:' + (on ? 'var(--main)' : 'var(--ground)') + '"></div>' +
        '<div style="display:flex;flex-direction:column;gap:4px;padding:0 10px;background:var(--ground)"><span class="mono" style="font-size:28px;color:' + (on ? 'var(--main)' : 'var(--dim)') + '">' + x[0] + '</span><span class="mono dim" style="font-size:20px">' + x[1] + '</span></div></div>'; }).join('') + '</div>';
  },
  // An outcome stamp: yellow for a suitable product found, coral for not resolved.
  stamp(cls, ok, text) {
    return '<div class="tag ' + (ok ? '' : 'hot ') + cls + '" style="position:relative;display:inline-block;padding:10px 46px 10px 18px;align-self:flex-start"><span class="line sm" style="font-size:34px">' + text + '</span></div>';
  },
  // Hang an element: it drops onto its rail at a, overshoots, swings out and keeps a faint sway.
  hang(el, t, a, i, drop) {
    const p = kit.eob(kit.seg(t, a, a + 0.55), 1.7), since = Math.max(0, t - a - 0.55);
    const sw = kit.lerp(-8, 0, p) + 2.6 * Math.exp(-since * 1.8) * Math.sin(since * 8) + 0.45 * Math.sin(t * 1.3 + i * 1.7);
    el.style.opacity = Math.min(1, kit.seg(t, a, a + 0.12));
    el.style.transform = 'translateY(' + kit.lerp(-(drop || 90), 0, p) + 'px) rotate(' + sw.toFixed(2) + 'deg)';
  },
  // A slow push on a layer, so no frame is ever frozen.
  push(el, t, dur, from, to) {
    el.style.transform = 'scale(' + kit.lerp(from || 1, to || 1.025, kit.eio(kit.seg(t, 0, dur))) + ')';
  },
};


(()=>{const { seg, eo, eio, eob, lerp } = kit;

      W.sign('intro-hang', 960, 150, 1440, 260, 112, 'From product search to informed choice') +
      '<div class="words" style="left:260px;top:520px;width:1400px;align-items:center;text-align:center;gap:26px">' +

      '<p class="intro-q" style="font-size:40px;line-height:1.38">How does access to product information and employee assistance shape customers’ ability to make informed product choices across Clas Ohlson’s online and in-store customer journey?</p>' +
      '<p class="mono dim intro-c" style="font-size:24px">MST 0220 Customer Experience Management · BI · 2026</p></div>' +
      '</div><div class="edge"></div></div>'));
    const q = s => kit.stage.querySelector(s);

    this.eye.style.opacity = 1;

    this.qn.style.opacity = a; this.qn.style.transform = 'translateY(' + lerp(26, 0, a) + 'px)';

});
})();

(()=>{const { seg, eo, eio, lerp, TextFx } = kit;
const NUMS = [['6', 'mystery-shopping visits', 'Mystery shopping', ''], ['4', 'stores', 'Mystery shopping', ''], ['3', 'observation dates', 'Mystery shopping', ''], ['74', 'Google Maps reviews', 'Secondary data', 'ink']];
kit.scene('method', {
  init(kit) {
    kit.stage.append(kit.h('<div class="ground"><div class="method-cam" style="position:absolute;inset:0;transform-origin:960px 540px">' +
      '<div class="words" style="left:140px;top:96px;width:1640px;gap:14px"><p class="eyebrow">Data collection</p><h2 class="line md method-line">What the findings rest on</h2></div>' +
      W.rail('method-rail', 120, 318, 1680) +
      NUMS.map((n, i) => '<div class="tag ' + n[3] + ' method-t" style="left:' + (140 + i * 420) + 'px;top:346px;width:380px;transform-origin:190px -14px">' +
        '<div style="display:flex;flex-direction:column;gap:6px"><span class="mono" style="font-size:22px;letter-spacing:.08em">' + n[2] + '</span><span class="line num" style="font-size:170px;line-height:.9">' + n[0] + '</span><span class="line sm" style="font-size:44px">' + n[1] + '</span></div></div>').join('') +
      '<div class="words" style="left:140px;top:770px;width:1640px;gap:16px">' +
      '<p class="body method-s">The 6 visits: Torggata ×2 · Stenersgata 2 ×2 · Strømmen Storsenter ×1 · Storo Storsenter ×1</p>' +
      '<p class="body method-s">19 October: 3 visits · 26 October: 2 visits · 3 November: 1 visit. 5 of the 6 began with a documented online search.</p>' +

  },
  render(t) {

    TextFx.fadeFromRight(this.line, t, 0.1);
    this.rail.style.transform = 'scaleX(' + eo(seg(t, 0.3, 0.9)) + ')';
    this.tags.forEach((el, i) => W.hang(el, t, 0.9 + i * 0.5, i, 110));
    this.ss.forEach((el, i) => { const a = eo(seg(t, 3.4 + i * 0.6, 3.9 + i * 0.6)); el.style.opacity = a; el.style.transform = 'translateX(' + lerp(26, 0, a) + 'px)'; });
  },

(()=>{const { seg, eo, eio, eob, lerp, clamp01, TextFx } = kit;
const STEPS = ['Search online', 'Check stock and shelf', 'Find the product', 'Get help', 'Understand the right choice'];
const NX = i => 290 + i * 335, PY = 600;
const T_NODE = [2.6, 3.3, 4.0, 4.7, 4.7];
kit.scene('journey', {
  init(kit) {
    kit.stage.append(kit.h('<div class="ground"><div class="journey-cam" style="position:absolute;inset:0;transform-origin:960px 560px">' +
      '<div class="words" style="left:140px;top:80px;width:1640px;gap:14px"><p class="eyebrow">Scope</p><h2 class="line md journey-line">The journey we audited</h2></div>' +
      '<div class="box journey-band" style="left:140px;top:262px;width:640px;border-top:4px solid var(--main);padding-top:10px"><span class="mono gold" style="font-size:24px;letter-spacing:.12em">ONLINE</span></div>' +
      '<div class="box journey-band" style="left:810px;top:262px;width:970px;border-top:4px solid var(--second);padding-top:10px"><span class="mono" style="font-size:24px;letter-spacing:.12em">IN THE STORE</span></div>' +
      STEPS.map((s, i) => '<div class="sign journey-s" style="left:' + (NX(i) - 150) + 'px;top:340px;width:300px;min-height:150px;flex-direction:column;gap:8px;padding:16px 18px;transform-origin:150px -20px' + (i < 2 ? ';background:var(--main)' : '') + '"><span class="mono" style="font-size:22px">' + (i + 1) + '</span><span style="font-size:44px">' + s + '</span></div>').join('') +
      '<div class="box" style="left:' + NX(0) + 'px;top:' + (PY - 3) + 'px;width:' + (NX(4) - NX(0)) + 'px;height:6px;border-radius:3px;background:var(--rail)"></div>' +
      STEPS.map((s, i) => '<div class="box journey-n" style="left:' + (NX(i) - 18) + 'px;top:' + (PY - 18) + 'px;width:36px;height:36px;border-radius:50%;background:var(--ground);border:6px solid var(--rail)"></div>').join('') +
      '<div class="box journey-m" style="left:-26px;top:' + (PY - 26) + 'px;width:52px;height:52px;border-radius:50%;background:var(--main);box-shadow:0 0 0 10px color-mix(in srgb, var(--main) 25%, transparent)"></div>' +
      '<div class="tag hot journey-brk" style="left:' + (NX(3) - 60) + 'px;top:' + (PY + 50) + 'px;padding:12px 50px 12px 20px"><span class="line sm" style="font-size:38px">Where the journey breaks</span></div>' +
      '<div class="words" style="left:140px;top:790px;width:1300px;gap:16px"><p class="line sm journey-a">Finding a product is not the same as choosing the right one.</p>' +
      '<p class="sub journey-b">Online stock and shelf information helped customers find products. Customers with little product knowledge still needed someone to explain performance, compatibility and fit.</p></div>' +
      '</div><div class="edge"></div></div>'));
    const q = s => kit.stage.querySelector(s), all = s => [...kit.stage.querySelectorAll(s)];
    Object.assign(this, { cam: q('.journey-cam'), line: q('.journey-line'), bands: all('.journey-band'), signs: all('.journey-s'), nodes: all('.journey-n'), m: q('.journey-m'), brk: q('.journey-brk'), a: q('.journey-a'), b: q('.journey-b') });
  },
  render(t) {
    W.push(this.cam, t, 12, 1, 1.025);
    TextFx.fadeFromRight(this.line, t, 0.1);
    this.bands.forEach((el, i) => { el.style.opacity = eo(seg(t, 0.6 + i * 0.3, 1.1 + i * 0.3)); });
    this.signs.forEach((el, i) => W.hang(el, t, 1.0 + i * 0.3, i, 70));
    let x = NX(0);
    for (let i = 1; i < 4; i++) x = lerp(x, NX(i), eio(seg(t, T_NODE[i - 1] + 0.15, T_NODE[i])));
    const stall = t > 4.7 ? 10 * Math.sin((t - 4.7) * 5) * Math.exp(-(t - 4.7) * 0.6) : 0;
    this.m.style.opacity = Math.min(1, seg(t, 2.3, 2.6));
    this.m.style.transform = 'translateX(' + (x + stall) + 'px)';
    this.nodes.forEach((el, i) => {

    const k = eob(seg(t, 5.1, 5.6), 1.6);
    this.brk.style.opacity = Math.min(1, seg(t, 5.1, 5.2)); this.brk.style.transform = 'scale(' + lerp(0.6, 1, k) + ') rotate(' + lerp(-6, -2, k) + 'deg)';
    TextFx.fadeFromRight(this.a, t, 5.7);

    this.b.style.opacity = b; this.b.style.transform = 'translateX(' + lerp(26, 0, b) + 'px)';
  },
});
})();

(()=>{const { seg, eo, eio, eob, lerp, TextFx } = kit;
const V = [
  ['MS1 · 12:15–12:35', 'Torggata', 'Wi-Fi routers and lamps', 'About 10 minutes trying to get attention. No one approached.', false, 'Left without help', ''],

kit.scene('day-one', {
  init(kit) {

    const all = s => [...kit.stage.querySelectorAll(s)];
    Object.assign(this, { cam: kit.stage.querySelector('.day-one-cam'), dates: kit.stage.querySelector('.day-one-dates'), line: kit.stage.querySelector('.day-one-line'), rail: kit.stage.querySelector('.day-one-rail'), cards: all('.day-one-c'), sts: all('.day-one-st') });
  },
  render(t) {
    W.push(this.cam, t, 16, 1, 1.02);
    this.dates.style.opacity = eo(seg(t, 0, 0.5));
    TextFx.fadeFromRight(this.line, t, 0.3);
    this.rail.style.transform = 'scaleX(' + eo(seg(t, 0.6, 1.2)) + ')';

const events=[];let bpm=84;const note=(instrument,pitch,o)=>events.push({instrument,pitch,...o});const api={tempo:b=>bpm=b,program:()=>{},note,chord:(i,ps,o)=>ps.forEach(p=>note(i,p,o)),pattern:(i,pat,o)=>{for(let r=0;r<o.repeat;r++)for(let j=0;j<pat.length;j++)if(pat[j]==='x')note(i,o.pitch[(r+j)%o.pitch.length],{t:(o.from+r*pat.length*.5+j*.5)*60/bpm,dur:.25,vel:o.vel})},drums:()=>{},fx:()=>{},master:()=>{}};window.makeScore(api,T);
function audioStart(){stopAudio();if(!sound||!playing)return;ctx??=new AudioContext();ctx.resume();for(const e of events){if(e.t+e.dur<pos||e.t>=total)continue;let match=e.pitch.match(/^([A-G])([b#]?)(\d)$/);if(!match)continue;let midi=12*(Number(match[3])+1)+({C:0,D:2,E:4,F:5,G:7,A:9,B:11}[match[1]])+(match[2]==='b'?-1:match[2]==='#'?1:0);const o=ctx.createOscillator(),g=ctx.createGain();o.type=e.instrument==='bass'?'triangle':'sine';o.frequency.value=440*2**((midi-69)/12);let at=ctx.currentTime+Math.max(0,e.t-pos),dur=Math.max(.05,Math.min(e.dur,e.t+e.dur-pos,total-Math.max(pos,e.t)));let gain=(e.vel||30)/127*.045;g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(gain,at+Math.min(.05,dur/3));g.gain.exponentialRampToValueAtTime(.0001,at+dur);o.connect(g);g.connect(ctx.destination);o.start(at);o.stop(at+dur+.02);nodes.push(o)}}
function toggle(){if(pos>=total)pos=0;playing=!playing;play.textContent=playing?'Pause':'Play';play.setAttribute('aria-label',playing?'Pause presentation':'Play presentation');last=performance.now();audioStart();render()}
play.onclick=toggle;seek.oninput=()=>{pos=Number(seek.value);render();audioStart()};chapters.onchange=()=>{pos=timeline[Number(chapters.value)].start;render();audioStart()};document.getElementById('sound').onclick=e=>{sound=!sound;e.target.textContent=sound?'Sound on':'Sound off';e.target.setAttribute('aria-pressed',sound);audioStart()};document.getElementById('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else if(screen.requestFullscreen)screen.requestFullscreen();else screen.webkitRequestFullscreen?.()};document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','SELECT','BUTTON'].includes(e.target.tagName)){e.preventDefault();toggle()}});
function tick(now){if(playing){pos=Math.min(total,pos+(now-last)/1000);if(pos>=total){playing=false;play.textContent='Replay';stopAudio()}render()}last=now;requestAnimationFrame(tick)}render();resize();requestAnimationFrame(tick);
window.checkScenes=()=>{let original=pos;for(let s of timeline)for(let t of [0,.5,s.dur/2,s.dur-.01]){pos=s.start+t;render()}pos=original;render();return timeline.length};
